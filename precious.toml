exclude = ["target"]

[commands.clippy]
type = "lint"
include = "**/*.rs"
invoke = "once"
path-args = "none"
working-dir.chdir-to = "run-tests"
cmd = [
    "cargo",
    "clippy",
    "--color",
    "always",
    "--locked",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "clippy::pedantic",
    "-D",
    "warnings",
]
ok_exit_codes = 0
lint_failure_exit_codes = 101
expect_stderr = true

[commands."clippy --fix"]
type = "tidy"
include = "**/*.rs"
invoke = "once"
path-args = "none"
working-dir.chdir-to = "run-tests"
cmd = [
    "cargo",
    "clippy",
    "--fix",
    "--allow-dirty",
    "--locked",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "clippy::pedantic",
]
ok_exit_codes = 0
lint_failure_exit_codes = 101
expect_stderr = true

[commands.rustfmt]
type = "both"
include = "**/*.rs"
cmd = ["rustfmt", "--edition", "2021"]
lint_flags = "--check"
ok_exit_codes = [0]
lint_failure_exit_codes = [1]

[commands."ruff for linting"]
type = "both"
include = ["*.py"]
cmd = "ruff"
lint_flags = ["check"]
tidy_flags = ["check", "--fix"]
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands."ruff for tidying"]
type = "both"
include = ["*.py"]
cmd = "ruff"
lint_flags = ["format", "--check"]
tidy_flags = ["format"]
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.oxfmt]
type = "both"
include = ["*.md", "*.yml", "*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint-flags = "--check"
tidy-flags = "--in-place"
ok-exit-codes = 0
lint-failure-exit-codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.shellcheck]
type = "lint"
include = "*.sh"
cmd = "shellcheck"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.shfmt]
type = "both"
include = "*.sh"
cmd = ["shfmt", "--simplify", "--indent", "4"]
lint_flags = "--diff"
tidy_flags = "--write"
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.typos]
type = "lint"
include = "*"
cmd = "typos"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2
