name: Lint

on: [push, pull_request]

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Check that code is lint clean using precious
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mise
        run: |
          set -e
          set -x
          curl https://mise.run | sh
          mise install
      - name: Run precious
        run: |
          mise exec -- precious lint -a
